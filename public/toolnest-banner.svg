<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with deep dark gradient -->
  <rect width="1200" height="420" fill="#0A0D14" rx="16"/>

  <!-- Subtle grid lines pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#00D4FF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="250" cy="120" r="140" fill="#00D4FF" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="300" r="160" fill="#8B5CF6" fill-opacity="0.14" filter="url(#glow)"/>
  <circle cx="600" cy="210" r="120" fill="#00D4FF" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Decorative Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Central ToolNest Brand Emblem (Matching Website & Favicon) -->
  <g transform="translate(600, 95)">
    <!-- Outer Ambient Glow Ring -->
    <circle cx="0" cy="0" r="48" fill="url(#primaryGrad)" fill-opacity="0.15" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- 64x64 ToolNest Brand Logo Centered -->
    <g transform="translate(-32, -32)">
      <!-- Squircle Tile Base -->
      <rect width="64" height="64" rx="18" fill="#0A0D14"/>
      <rect
        x="1.5"
        y="1.5"
        width="61"
        height="61"
        rx="16.5"
        stroke="url(#primaryGrad)"
        stroke-width="2"
        stroke-opacity="0.7"
      />

      <!-- Upper Nest Bar (Protective canopy & 'T' bar) -->
      <path
        d="M14 23 C14 15 22 13 32 13 C42 13 50 15 50 23"
        stroke="url(#primaryGrad)"
        stroke-width="4.5"
        stroke-linecap="round"
        fill="none"
      />

      <!-- Lower Nest Cradle (Deep bowl & 'N' foundation) -->
      <path
        d="M12 28 C12 43 20 51 32 51 C44 51 52 43 52 28"
        stroke="url(#secondaryGrad)"
        stroke-width="4.5"
        stroke-linecap="round"
        fill="none"
      />

      <!-- Flank Connectors -->
      <path
        d="M18 26 L18 34 M46 26 L46 34"
        stroke="url(#primaryGrad)"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-opacity="0.8"
        fill="none"
      />

      <!-- Central Nestled AI Star Diamond -->
      <path
        d="M32 19 L35.5 28.5 L45 32 L35.5 35.5 L32 45 L28.5 35.5 L19 32 L28.5 28.5 Z"
        fill="url(#coreGlow)"
        filter="url(#shadowGlow)"
      />
      <circle cx="32" cy="32" r="3" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Title & Branding -->
  <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="-0.5">
    Tool<tspan fill="url(#textGrad)">Nest</tspan> Server
  </text>

  <!-- Tagline -->
  <text x="600" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0.2">
    High-Performance REST API &amp; MongoDB Database Service
  </text>

  <!-- Category Pills / Tech Highlights -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: 50+ Curated Tools -->
    <g transform="translate(-390, 0)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="#121624" stroke="#00D4FF" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#00D4FF"/>
      <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">50+ Seeded Tools</text>
    </g>

    <!-- Pill 2: Express + TypeScript -->
    <g transform="translate(-190, 0)">
      <rect x="0" y="0" width="185" height="36" rx="18" fill="#121624" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#8B5CF6"/>
      <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Express &amp; TypeScript</text>
    </g>

    <!-- Pill 3: JWT & Role RBAC -->
    <g transform="translate(15, 0)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="#121624" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#10B981"/>
      <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">JWT &amp; Admin RBAC</text>
    </g>

    <!-- Pill 4: Stripe Webhooks -->
    <g transform="translate(215, 0)">
      <rect x="0" y="0" width="185" height="36" rx="18" fill="#121624" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#F59E0B"/>
      <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Stripe Subscriptions</text>
    </g>
  </g>

  <!-- Featured AI Tool Mentions Bottom Row -->
  <g transform="translate(600, 365)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.5">
      FEATURING • CHATGPT • CLAUDE 3.5 • CURSOR • MIDJOURNEY • PERPLEXITY • GEMINI • BOLT.NEW • RUNWAY • SUNO • V0
    </text>
  </g>
</svg>
