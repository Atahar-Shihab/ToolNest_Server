<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with deep dark gradient -->
  <rect width="1200" height="420" fill="#0A0D14" rx="16"/>

  <!-- Subtle grid lines pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="250" cy="120" r="140" fill="#00D4FF" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="300" r="160" fill="#8B5CF6" fill-opacity="0.14" filter="url(#glow)"/>
  <circle cx="600" cy="210" r="120" fill="#00D4FF" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Decorative Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Central Emblem Container -->
  <g transform="translate(600, 95)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="44" fill="url(#primaryGrad)" fill-opacity="0.15" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Inner Badge -->
    <rect x="-30" y="-30" width="60" height="60" rx="16" fill="url(#primaryGrad)"/>
    <!-- Rocket Vector Icon -->
    <path d="M-8 8 L-14 14 M-14 8 L-14 14 L-8 14 M8 -14 C12 -6 8 4 -4 10 L-10 4 C-4 -8 6 -12 8 -14 Z M0 -6 C1 -5 1 -3 0 -2 C-1 -1 -3 -1 -4 -2 C-5 -3 -5 -5 -4 -6 C-3 -7 -1 -7 0 -6 Z" 
          stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(3, -3) scale(1.3)"/>
  </g>

  <!-- Title & Branding -->
  <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="-0.5">
    Tool<tspan fill="url(#textGrad)">Nest</tspan> Server
  </text>

  <!-- Tagline -->
  <text x="600" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0.2">
    High-Performance RESTful API, MongoDB Atlas Engine &amp; Stripe Integration
  </text>

  <!-- Category Pills / Tech Highlights -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: Express & TypeScript -->
    <g transform="translate(-390, 0)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="#121624" stroke="#00D4FF" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#00D4FF"/>
      <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Express &amp; TypeScript</text>
    </g>

    <!-- Pill 2: MongoDB Atlas -->
    <g transform="translate(-190, 0)">
      <rect x="0" y="0" width="185" height="36" rx="18" fill="#121624" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#8B5CF6"/>
      <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">MongoDB Atlas</text>
    </g>

    <!-- Pill 3: JWT & Google OAuth -->
    <g transform="translate(15, 0)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="#121624" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#10B981"/>
      <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">JWT &amp; OAuth 2.0</text>
    </g>

    <!-- Pill 4: Stripe Payments -->
    <g transform="translate(215, 0)">
      <rect x="0" y="0" width="185" height="36" rx="18" fill="#121624" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#F59E0B"/>
      <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Stripe PaymentIntents</text>
    </g>
  </g>

  <!-- Featured AI Tool Mentions Bottom Row -->
  <g transform="translate(600, 365)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.5">
      SECURE ROLE RBAC • REAL-TIME RATING AGGREGATION • 50+ CURATED TOOLS • ADMIN MODERATION
    </text>
  </g>
</svg>
